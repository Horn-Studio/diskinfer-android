.card-icon .md-icon { --icon-size: clamp(10px, 1.3cqw, 24px); min-width: 0; min-height: 0; }

.metric-main {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.2cqw;
  margin: .8cqw 0 .65cqw;
}

.metric-value {
  display: flex;
  align-items: baseline;
  gap: .48cqw;
  color: var(--md-on-surface);
  font-size: var(--type-metric);
  line-height: .92;
  font-weight: 400;
  letter-spacing: -.055em;
  font-variant-numeric: tabular-nums;
}

.metric-unit {
  color: var(--md-on-surface-variant);
  font-size: var(--type-title-large);
  line-height: 1;
  font-weight: 400;
  letter-spacing: 0;
}

.metric-note {
  max-width: 15cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-medium);
  line-height: 1.45;
  text-align: right;
}

.track-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .7cqw;
  margin-top: .42cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  letter-spacing: .2px;
}

.shortfall {
  color: var(--md-on-error-container);
  background: var(--md-error-container);
  border-radius: var(--shape-xs);
  padding: .16cqw .45cqw;
  line-height: 1.2;
  white-space: nowrap;
}

.s1-routes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2cqw;
}

.route-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: .95cqw;
  min-height: 7.4cqw;
  padding: 1.15cqw 1.25cqw;
  overflow: hidden;
  background: var(--md-surface);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
}

.route-icon {
  width: 2.85cqw;
  height: 2.85cqw;
  min-width: 18px;
  min-height: 18px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-error-container);
  color: var(--md-on-error-container);
}

.route-icon .md-icon { --icon-size: clamp(10px, 1.4cqw, 26px); min-width: 0; min-height: 0; }

.route-copy { min-width: 0; flex: 1; }

.route-title-wrap {
  position: relative;
  display: inline-block;
  max-width: 100%;
}

.route-title {
  color: var(--md-on-surface);
  font-size: var(--type-title-medium);
  font-weight: 500;
  line-height: 1.4;
}

.route-strike {
  position: absolute;
  left: -.2cqw;
  right: -.2cqw;
  top: 52%;
  height: 1.5px;
  border-radius: 2px;
  background: var(--md-error);
  transform: scaleX(0);
  transform-origin: left center;
  will-change: transform;
}

.route-reason {
  margin-top: .1cqw;
  color: var(--md-error);
  font-size: var(--type-label-large);
  font-weight: 500;
}

.route-detail {
  margin-top: .06cqw;
  overflow: hidden;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  line-height: 1.35;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.route-x {
  flex: 0 0 auto;
  width: 1.2cqw;
  height: 1.2cqw;
  min-width: 16px;
  min-height: 16px;
  color: var(--md-error);
  opacity: .8;
}

.route-x .md-icon { --icon-size: 100%; min-width: 0; min-height: 0; }

/* ============================================================
   场景 2
   ============================================================ */
.s2-body {
  display: flex;
  flex-direction: column;
  gap: 1.2cqw;
}

.way-grid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr 4.3cqw 1.12fr 4.3cqw 1fr;
  align-items: stretch;
}

.way-card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 1.25cqw;
  overflow: hidden;
  background: var(--md-surface);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
  box-shadow: none;
}

.way-card.is-core {
  background: var(--md-surface-container-highest);
  border-color: transparent;
  box-shadow: var(--elevation-1);
}

.way-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .6cqw;
}

.way-heading {
  display: flex;
  align-items: center;
  gap: .62cqw;
  min-width: 0;
}

.way-icon {
  width: 2.45cqw;
  height: 2.45cqw;
  min-width: 16px;
  min-height: 16px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.way-icon.secondary {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}

.way-icon.tertiary {
  background: var(--md-tertiary-container);
  color: var(--md-on-tertiary-container);
}

.way-icon .md-icon { --icon-size: clamp(10px, 1.3cqw, 24px); min-width: 0; min-height: 0; }

.way-label {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-large);
  font-weight: 500;
  letter-spacing: .2px;
}

.way-visual {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: .45cqw 0;
}

.way-copy { margin-top: auto; }

.way-name {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-medium);
  font-weight: 500;
  letter-spacing: .2px;
}

.way-value {
  margin-top: .12cqw;
  color: var(--md-on-surface);
  font-size: var(--type-headline-small);
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: -.2px;
  white-space: nowrap;
}

.way-note {
  margin-top: .16cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-medium);
  line-height: 1.45;
}

.disk-stack {
  position: relative;
  width: 14.8cqw;
  height: 11.2cqw;
}

.disk-layer {
  position: absolute;
  left: 50%;
  width: 12.4cqw;
  height: 3.4cqw;
  transform: translateX(-50%);
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
  background: var(--md-surface-container-high);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .22);
}

.disk-layer:nth-child(1) { top: .25cqw; left: 49.2%; opacity: .55; width: 11.5cqw; }
.disk-layer:nth-child(2) { top: 1.45cqw; left: 49.6%; opacity: .75; width: 12cqw; }
.disk-layer:nth-child(3) { top: 2.65cqw; }
.disk-layer:nth-child(4) {
  top: 3.85cqw;
  background: var(--md-primary-container);
  border-color: transparent;
}

.disk-layer::before {
  content: "";
  position: absolute;
  left: .95cqw;
  top: .85cqw;
  width: 1.15cqw;
  height: 1.15cqw;
  border: 1.5px solid var(--md-outline);
  border-radius: 50%;
}

.disk-layer:nth-child(4)::before {
  border-color: var(--md-on-primary-container);
}

.disk-layer::after {
  content: "";
  position: absolute;
  top: 1.35cqw;
  left: 2.8cqw;
  right: 1cqw;
  height: 1px;
  background: var(--md-outline-variant);
}

.disk-layer:nth-child(4)::after { background: rgba(234, 221, 255, .38); }

.disk-badge {
  position: absolute;
  right: .4cqw;
  bottom: .1cqw;
  width: 2.2cqw;
  height: 2.2cqw;
  min-width: 14px;
  min-height: 14px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-primary);
  color: var(--md-on-primary);
  box-shadow: var(--elevation-1);
}

.disk-badge .md-icon { --icon-size: clamp(8px, 1.05cqw, 20px); min-width: 0; min-height: 0; }

.capacity-box {
  position: relative;
  width: 100%;
  height: 10.4cqw;
  overflow: hidden;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-md);
  background: var(--md-surface-container-lowest);
}

.capacity-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  --icon-size: clamp(14px, 3.15cqw, 58px);
  transform: translate(-50%, -58%);
  color: var(--md-outline);
  opacity: .55;
}

.capacity-mark {
  position: absolute;
  left: .9cqw;
  right: .9cqw;
  bottom: .72cqw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  letter-spacing: .3px;
}

.capacity-mark span:first-child { color: var(--md-primary); }

.cpu-wrap {
  position: relative;
  display: grid;
  place-items: center;
  width: 12.2cqw;
  height: 12.2cqw;
}

.cpu-chip {
  position: relative;
  width: 9.4cqw;
  height: 9.4cqw;
  display: grid;
  place-items: center;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-md);
  background: var(--md-surface-container-high);
  color: var(--md-primary);
}

.cpu-chip .md-icon {
  --icon-size: clamp(12px, 2.6cqw, 50px);
  z-index: 1;
}

.cpu-chip::before {
  content: "";
  position: absolute;
  inset: .75cqw;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
  opacity: .65;
}

.cpu-chip::after {
  content: "";
  position: absolute;
  inset: -0.35cqw;
  border-top: 2px solid var(--md-outline-variant);
  border-bottom: 2px solid var(--md-outline-variant);
  border-radius: .4cqw;
}

.cpu-dots {
  position: absolute;
  inset: 1.2cqw;
  background-image: radial-gradient(circle, var(--md-outline) .7px, transparent .9px);
  background-size: .72cqw .72cqw;
  opacity: .3;
}

.cpu-pulse {
  position: absolute;
  width: .5cqw;
  height: .5cqw;
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--md-tertiary);
  opacity: 0;
}

.flow-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding-top: .5cqw;
}

.flow-main {
  color: var(--md-primary);
  font-size: var(--type-label-large);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: .2px;
  white-space: nowrap;
}

.flow-sub {
  margin-top: .12cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: .2px;
  white-space: nowrap;
}

.flow-track {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  height: 1.2cqw;
  margin-top: .55cqw;
}

.flow-track::before {
  content: "";
  position: absolute;
  left: 0;
  right: .5cqw;
  top: 50%;
  height: 1px;
  background: var(--md-outline-variant);
}

.flow-track::after { display: none; }

.flow-dot {
  position: absolute;
  z-index: 2;
  left: 0;
  top: 50%;
  width: .5cqw;
  height: .5cqw;
  min-width: 6px;
  min-height: 6px;
  border-radius: 50%;
  background: var(--md-primary);
  opacity: 0;
  transform: translate(-50%, -50%);
  will-change: left, opacity;
}

.flow-arrow {
  position: absolute;
  right: 0;
  top: 50%;
  width: .95cqw;
  height: .95cqw;
  min-width: 14px;
  min-height: 14px;
  transform: translateY(-50%);
  color: var(--md-outline);
}

.flow-arrow .md-icon { --icon-size: 100%; min-width: 0; min-height: 0; }

.impl-strip {
  flex: 0 0 auto;
  min-height: 3.9cqw;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
  background: var(--md-surface-container-low);
}

.impl-item {
  display: flex;
  align-items: center;
  gap: .65cqw;
  min-width: 0;
  padding: 0 1.15cqw;
  border-left: 1px solid var(--md-outline-variant);
}

.impl-item:first-child { border-left: 0; }
.impl-icon { color: var(--md-primary); display: flex; }
.impl-icon .md-icon { --icon-size: clamp(9px, 1.15cqw, 22px); min-width: 0; min-height: 0; }

.impl-code {
  color: var(--md-on-surface);
  font-size: var(--type-label-large);
  font-weight: 500;
  white-space: nowrap;
}

.impl-text {
  overflow: hidden;
  color: var(--md-on-surface-variant);
  font-size: var(--type-body-medium);
  white-space: nowrap;
  text-overflow: ellipsis;
}

/* ============================================================
   场景 3 · 64 层搬运 + 计算
   ============================================================ */
.s3-body {
  display: flex;
  flex-direction: column;
  gap: .85cqw;
}

/* ---------- 输入输出条 ---------- */
.io-strip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: .9cqw;
  padding: .62cqw 1.05cqw;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-sm);
  background: var(--md-surface-container-low);
}

.io-side {
  display: flex;
  align-items: center;
  gap: .55cqw;
  min-width: 0;
}

.io-side.answer { flex: 1; }

.io-tag {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1.6cqw;
  height: 1.6cqw;
  min-width: 18px;
  min-height: 18px;
  border-radius: 50%;
  font-size: var(--type-label-small);
  font-weight: 500;
  line-height: 1;
}

.io-tag.q {
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.io-tag.a {
  background: var(--md-tertiary-container);
  color: var(--md-on-tertiary-container);
}

.io-question {
  color: var(--md-on-surface);
  font-size: clamp(12px, 1.32cqw, 28px);
  line-height: 1.25;
  letter-spacing: -.1px;
  white-space: nowrap;
}

.io-chips {
  display: flex;
  align-items: center;
  gap: .26cqw;
}

.io-chip {
  display: inline-flex;
  align-items: baseline;
  gap: .18cqw;
  padding: .16cqw .34cqw;
  border: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-xs);
  color: var(--md-on-surface);
  font-size: var(--type-label-small);
  font-weight: 500;
  line-height: 1.2;
  opacity: 0;
  will-change: opacity, transform;
}

.io-chip b {
  color: var(--md-primary);
  font-size: var(--type-label-small);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.io-arrow {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1.05cqw;
  height: 1.05cqw;
  min-width: 13px;
  min-height: 13px;
  color: var(--md-outline);
}

.io-arrow .md-icon { --icon-size: 100%; min-width: 0; min-height: 0; }

.io-answer {
  min-width: 0;
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  color: var(--md-on-surface);
  font-size: clamp(13px, 1.55cqw, 33px);
  line-height: 1.2;
  letter-spacing: -.2px;
  white-space: nowrap;
}

.io-token {
  display: none;
  will-change: opacity, transform;
}

.io-token.is-on { display: inline-block; }

.io-caret {
  display: inline-block;
  width: .13cqw;
  min-width: 2px;
  height: .9em;
  margin-left: .1cqw;
  border-radius: 1px;
  background: var(--md-tertiary);
  transform: translateY(.06em);
  will-change: opacity;
}

.io-stats {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: .85cqw;
  padding-left: .85cqw;
  border-left: 1px solid var(--md-outline-variant);
}

.io-stat {
  display: flex;
  align-items: baseline;
  gap: .26cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
}

.io-stat b {
  color: var(--md-on-surface);
  font-size: var(--type-title-medium);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.io-phase {
  display: inline-flex;
  align-items: center;
  min-height: clamp(13px, 1.55cqw, 25px);
  padding: .2cqw .5cqw;
  border-radius: var(--shape-xs);
  background: var(--md-surface-container-high);
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  white-space: nowrap;
}

.io-phase.is-prefill {
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.io-phase.is-decode {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}

/* ---------- 四区 ---------- */
.zones {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1.3fr 1fr 1.1fr .95fr;
  gap: .9cqw;
}

.zone {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 1.05cqw;
  border-radius: var(--shape-sm);
  background: var(--md-surface-container-low);
  box-shadow: var(--elevation-1);
  overflow: hidden;
}

.zone.is-outlined {
  background: var(--md-surface);
  border: 1px solid var(--md-outline-variant);
  box-shadow: none;
}

.zone-head {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: .5cqw;
}

.zone-heading {
  display: flex;
  align-items: center;
  gap: .55cqw;
  min-width: 0;
}

.zone-heading .icon-tile {
  width: 2.15cqw;
  height: 2.15cqw;
  min-width: 15px;
  min-height: 15px;
}

.zone-heading .icon-tile .md-icon { --icon-size: clamp(9px, 1.15cqw, 21px); }

.zone-label {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  letter-spacing: .3px;
  line-height: 1.3;
}

.zone-title {
  color: var(--md-on-surface);
  font-size: var(--type-title-medium);
  line-height: 1.25;
  font-weight: 400;
  letter-spacing: 0;
  white-space: nowrap;
}

.zone-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5cqw;
  margin-top: auto;
  padding-top: .45cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  line-height: 1.35;
}

.zone-foot b {
  color: var(--md-on-surface);
  font-weight: 500;
  white-space: nowrap;
}

/* 磁盘 64 格 */
.layer-grid {
  flex: 0 0 auto;
  width: 19.6cqw;
  height: 19.6cqw;
  margin: .5cqw auto .1cqw;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  gap: .22cqw;
}

.layer-cell {
  display: grid;
  place-items: center;
  border-radius: 2px;
  background: var(--md-surface-container-high);
  color: var(--md-on-surface-variant);
  font-size: clamp(5px, .48cqw, 10px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  will-change: background-color, color;
}

.layer-cell.is-read {
  background: var(--md-surface-container);
  color: var(--md-outline);
}

.layer-cell.is-current {
  background: var(--md-primary);
  color: var(--md-on-primary);
}

/* 内存 8 槽 */
.mem-grid {
  flex: 1;
  min-height: 0;
  margin-top: .5cqw;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(4, 1fr);
  gap: .34cqw;
}

.mem-slot {
  position: relative;
  border-radius: var(--shape-xs);
}

.mem-slot::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px dashed rgba(147, 143, 153, .2);
  border-radius: inherit;
}

.mem-block {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .3cqw;
  padding: 0 .5cqw;
  border-radius: inherit;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  opacity: 0;
  will-change: opacity;

.mem-name {
  overflow: hidden;
  font-size: var(--type-label-small);
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mem-pin {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: .18cqw;
  font-size: var(--type-label-small);
  font-weight: 500;
  opacity: .75;
}

.mem-block.is-evict {
  background: var(--md-error-container);
  color: var(--md-on-error-container);
}

.mem-pin::before {
  content: "";
  width: .22cqw;
  height: .22cqw;
  min-width: 3px;
  min-height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.mem-meta {
  flex: 0 0 auto;
  margin-top: .55cqw;
}

.mem-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .4cqw;
}

.mem-used {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.mem-evict {
  padding: .1cqw .35cqw;
  border-radius: var(--shape-xs);
  background: var(--md-error-container);
  color: var(--md-on-error-container);
  font-size: var(--type-label-small);
  font-weight: 500;
  line-height: 1.3;
  opacity: 0;
  white-space: nowrap;
}

.mem-bar {
  position: relative;
  height: 4px;
  min-height: 4px;
  margin-top: .3cqw;
  overflow: hidden;
  border-radius: 2px;
  background: var(--md-surface-container-highest);
}

.mem-bar i {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: var(--md-primary);
  transform-origin: left center;
  will-change: transform;
}

/* CPU 计算 */
.cpu-visual {
  position: relative;
  flex: 0 0 auto;
  width: 7.4cqw;
  height: 7.4cqw;
  margin: .65cqw auto .2cqw;
  display: grid;
  place-items: center;
}

.cpu-ring {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.cpu-ring .ring-track {
  fill: none;
  stroke: var(--md-surface-container-highest);
  stroke-width: 3;
}

.cpu-ring .ring-arc {
  fill: none;
  stroke: var(--md-primary);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 289.03;
  stroke-dashoffset: 289.03;
  will-change: stroke-dashoffset;
}

.cpu-core {
  position: relative;
  width: 4.1cqw;
  height: 4.1cqw;
  display: grid;
  place-items: center;
  border-radius: var(--shape-md);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  will-change: transform;
}

.cpu-core .md-icon { --icon-size: clamp(12px, 1.7cqw, 34px); }

.cpu-sub {
  flex: 0 0 auto;
  margin-top: .15cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  text-align: center;
}

.cpu-range {
  flex: 0 0 auto;
  text-align: center;
  color: var(--md-on-surface);
  font-size: var(--type-label-medium);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: .2px;
}

.cpu-lanes {
  flex: 0 0 auto;
  height: 4.6cqw;
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  gap: .26cqw;
  padding: .5cqw 0 .35cqw;
}

.cpu-lane {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  border-radius: 2px;
  background: var(--md-surface-container-high);
}

.cpu-lane i {
  display: block;
  width: 100%;
  height: 0;
  background: var(--md-primary);
  will-change: height;
}

/* KV 缓存 */
.kv-grid {
  flex: 1;
  min-height: 0;
  margin-top: .55cqw;
  display: flex;
  gap: .3cqw;
}

.kv-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: .22cqw;
}

.kv-track {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  border-radius: 2px;
  background: var(--md-surface-container-high);
}

.kv-track::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(20, 18, 24, .55) 3px,
    rgba(20, 18, 24, .55) 4px
  );
  pointer-events: none;
}

.kv-track i {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 0;
  background: var(--md-primary);
  will-change: height;
}

.kv-col.is-gen .kv-track i { background: var(--md-tertiary); }

.kv-col.is-gen .kv-label { color: var(--md-tertiary); }

.kv-col.is-gen-start { margin-left: .3cqw; }

.kv-label {
  flex: 0 0 auto;
  overflow: hidden;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  line-height: 1.2;
  text-align: center;
  white-space: nowrap;
  text-overflow: clip;
}

/* 飞行块 */
.zone-fly {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
  overflow: visible;
}

.fly-block {
  position: absolute;
  top: 0;
  left: 0;
  display: grid;
  place-items: center;
  border-radius: 3px;
  background: var(--md-primary-container);
  box-shadow: 0 0 0 1px rgba(208, 188, 255, .42), 0 8px 18px rgba(0, 0, 0, .45);
  color: var(--md-on-primary-container);
  font-size: clamp(5px, .5cqw, 11px);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  will-change: transform, opacity;
}

/* ============================================================
   场景 4 · 小结
   ============================================================ */
.final-body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1.34fr .66fr;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 1.7cqw 3cqw;
  position: relative;
}

.final-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 2;
}

.summary-list {
  border-top: 1px solid var(--md-outline-variant);
}

.summary-item {
  display: flex;
  align-items: center;
  gap: .9cqw;
  padding: 1.2cqw 0;
  border-bottom: 1px solid var(--md-outline-variant);
  will-change: opacity, transform;
}

.summary-icon {
  width: 2.9cqw;
  height: 2.9cqw;
  min-width: 18px;
  min-height: 18px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
}

.summary-icon.secondary {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
}

.summary-icon.tertiary {
  background: var(--md-tertiary-container);
  color: var(--md-on-tertiary-container);
}

.summary-icon .md-icon { --icon-size: clamp(10px, 1.45cqw, 28px); min-width: 0; min-height: 0; }

.summary-text-wrap {
  display: flex;
  align-items: baseline;
  gap: .85cqw;
  min-width: 0;
}

.summary-no {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-medium);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.summary-text {
  color: var(--md-on-surface);
  font-size: var(--type-title-large);
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: -.1px;
}

.summary-formula {
  display: flex;
  align-items: baseline;
  gap: .12em;
  min-width: 0;
  color: var(--md-on-surface);
  font-size: var(--type-title-large);
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: -.1px;
  white-space: nowrap;
}

.summary-formula .op {
  padding: 0 .12em;
  color: var(--md-outline);
}

.summary-formula .term.primary { color: var(--md-primary); }
.summary-formula .term.tertiary { color: var(--md-tertiary); }

.final-art {
  min-width: 0;
  position: relative;
  display: grid;
  place-items: center;
}

.final-orb {
  position: absolute;
  width: 18.4cqw;
  height: 18.4cqw;
  display: grid;
  place-items: center;
  border-radius: var(--shape-lg);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  transform: rotate(-6deg);
}

.final-orb .md-icon {
  --icon-size: clamp(32px, 6.2cqw, 120px);
  transform: rotate(6deg);
  opacity: .92;
}

.final-orb-chip {
  position: absolute;
  right: 3.2cqw;
  bottom: 9.1cqw;
  width: 4.2cqw;
  height: 4.2cqw;
  min-width: 24px;
  min-height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-tertiary-container);
  color: var(--md-on-tertiary-container);
  box-shadow: var(--elevation-2);
}

.final-orb-chip .md-icon { --icon-size: clamp(12px, 1.8cqw, 34px); min-width: 0; min-height: 0; }

.final-credit {
  margin-left: auto;
  padding-left: 1.2cqw;
  min-width: 0;
  color: var(--md-on-primary-container);
  font-size: var(--type-label-medium);
  font-weight: 500;
  letter-spacing: .2px;
  white-space: nowrap;
  opacity: .72;
  will-change: opacity;
}

/* 收束句：整段最后一句，独立成条，进来就能读。 */
.final-close {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: .9cqw;
  padding: 1.15cqw 1.4cqw;
  border-radius: var(--shape-md);
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  will-change: opacity, transform;
}

.final-close-icon {
  width: 2.3cqw;
  height: 2.3cqw;
  min-width: 16px;
  min-height: 16px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(234, 221, 255, .14);
  color: var(--md-on-primary-container);
}

.final-close-icon .md-icon { --icon-size: clamp(10px, 1.25cqw, 23px); min-width: 0; min-height: 0; }

.final-close-text {
  min-width: 0;
  font-size: clamp(15px, 1.95cqw, 40px);
  font-weight: 400;
  line-height: 1.25;
  letter-spacing: -.2px;
}

/* 图标的语义色 */
.tone-primary { --tone: var(--md-primary); --tone-bg: var(--md-primary-container); --tone-fg: var(--md-on-primary-container); }
.tone-secondary { --tone: var(--md-secondary); --tone-bg: var(--md-secondary-container); --tone-fg: var(--md-on-secondary-container); }
.tone-tertiary { --tone: var(--md-tertiary); --tone-bg: var(--md-tertiary-container); --tone-fg: var(--md-on-tertiary-container); }

  .track-fill,

<script>

(() => {
  'use strict';

  /* ============================================================
     1. 基础工具
     ============================================================ */
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const clamp01 = value => clamp(value, 0, 1);

  // M3 emphasized / standard easing，供逐帧时间轴使用。
  const cubicBezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1;
    const bx = 3 * (x2 - x1) - cx;
    const ax = 1 - cx - bx;
    const cy = 3 * y1;
    const by = 3 * (y2 - y1) - cy;
    const ay = 1 - cy - by;
    const sampleX = t => ((ax * t + bx) * t + cx) * t;
    const sampleY = t => ((ay * t + by) * t + cy) * t;
    const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;
    return value => {
      if (value <= 0) return 0;
      if (value >= 1) return 1;
      let t = value;
      for (let i = 0; i < 5; i += 1) {
        const delta = sampleX(t) - value;
        if (Math.abs(delta) < 1e-5) break;
        const slope = sampleDX(t);
        if (Math.abs(slope) < 1e-6) break;
        t = clamp01(t - delta / slope);
      }
      return clamp01(sampleY(t));
    };
  };
  const smooth = value => {
    const v = clamp01(value);
    return v * v * (3 - 2 * v);
  };
  const easeOut = cubicBezier(.2, 0, 0, 1);
  const emphasized = cubicBezier(.05, .7, .1, 1);
  const lerp = (a, b, p) => a + (b - a) * p;
  const pad2 = value => String(value).padStart(2, '0');
  const fmt = (template, values) => template.replace(/\{(\w+)\}/g, (_, key) => (
    Object.prototype.hasOwnProperty.call(values, key) ? values[key] : ''
  ));
  const readPath = path => path.split('.').reduce((node, key) => (
    node == null ? undefined : node[key]
  ), TEXT);
  const setTransform = (el, value) => { el.style.transform = value; };
  const stageEl = $('#stage');

  // 动态循环里统一用 inline SVG 图标，保持 Material Symbols Rounded 的线条风格。
  const mdIcon = (id, className = 'md-icon') => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', className);
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#${id}`);
    svg.appendChild(use);
    return svg;
  };

  // MD3 emphasized decelerate：用于位移与入场，不改变进度本身的时间映射。
  const enter = (el, p, base = .90, distance = 1.2) => {
    const e = emphasized(p);
    el.style.opacity = String(base + (1 - base) * e);
    setTransform(el, `translate3d(0, ${((1 - e) * distance).toFixed(3)}cqw, 0)`);
  };

  const span = (label, start, end, time) => clamp01((time - start) / (end - start));

  /* ============================================================
     2. TEXT 落到 DOM + 动态列表
     ============================================================ */
  function hydrateText() {
    document.title = TEXT.docTitle;
    stageEl.setAttribute('aria-label', TEXT.stageLabel);
    $$('[data-t]').forEach(el => {
      const value = readPath(el.dataset.t);
      if (value !== undefined && value !== null) el.textContent = value;
    });
  }

  function buildTimeline() {
    let cursor = 0;
    const segments = TIMELINE.map(item => {
      const durMs = Math.max(0, Number(item.dur) || 0);
      const segment = {
        id: item.id,
        durMs,
        start: cursor / 1000,
        end: (cursor + durMs) / 1000,
        durSec: durMs / 1000
      };
      cursor += durMs;
      return segment;
    });
    return { segments, totalSec: cursor / 1000 };
  }

  function buildTimelineNotches(segments, totalSec) {
    const host = $('#timelineNotches');
    if (!host || totalSec <= 0) return;
    segments.forEach(segment => {
      const notch = document.createElement('div');
      notch.className = 'timeline-notch';
      notch.style.width = `${(segment.durMs / (totalSec * 1000)) * 100}%`;
      host.appendChild(notch);
    });
  }

  function buildImplStrip() {
    const host = $('#s2Strip');
    TEXT.s2.strip.forEach(item => {
      const row = document.createElement('div');
      row.className = 'impl-item';
      const iconWrap = document.createElement('span');
      iconWrap.className = 'impl-icon';
      iconWrap.appendChild(mdIcon(item.icon));
      const code = document.createElement('span');
      code.className = 'impl-code';
      code.textContent = item.code;
      const text = document.createElement('span');
      text.className = 'impl-text';
      text.textContent = item.text;
      row.append(iconWrap, code, text);
      host.appendChild(row);
    });
  }

  // 64 层网格 + 8 个驻留块 + 8 个飞行块 + 8 条计算条 + 6 列 KV
  function buildScene3() {
    const cellHost = $('#s3LayerGrid');
    const cells = [];
    for (let i = 0; i < 64; i += 1) {
      const cell = document.createElement('i');
      cell.className = 'layer-cell';
      cell.textContent = pad2(i);
      cellHost.appendChild(cell);
      cells.push(cell);
    }

    const memHost = $('#s3MemGrid');
    const slots = [];
    for (let i = 0; i < 8; i += 1) {
      const slot = document.createElement('div');
      slot.className = 'mem-slot';
      const block = document.createElement('div');
      block.className = 'mem-block';
      const name = document.createElement('span');
      name.className = 'mem-name';
      const pin = document.createElement('span');
      pin.className = 'mem-pin';
      pin.textContent = 'pin';
      block.append(name, pin);
      slot.appendChild(block);
      memHost.appendChild(slot);
      slots.push({ slot, block, name });
    }

    const flyHost = $('#s3Fly');
    const flies = [];
    for (let i = 0; i < 8; i += 1) {
      const fly = document.createElement('div');
      fly.className = 'fly-block';
      flyHost.appendChild(fly);
      flies.push(fly);
    }

    const laneHost = $('#s3CpuLanes');
    const lanes = [];
    for (let i = 0; i < 8; i += 1) {
      const lane = document.createElement('div');
      lane.className = 'cpu-lane';
      const fill = document.createElement('i');
      lane.appendChild(fill);
      laneHost.appendChild(lane);
      lanes.push(fill);
    }

    const kvHost = $('#s3KvGrid');
    const kvCols = TEXT.s3.kv.tokens.map((label, index) => {
      const col = document.createElement('div');
      col.className = 'kv-col';
      if (index >= 3) col.classList.add('is-gen');
      if (index === 3) col.classList.add('is-gen-start');
      const track = document.createElement('div');
      track.className = 'kv-track';
      const fill = document.createElement('i');
      track.appendChild(fill);
      const tag = document.createElement('span');
      tag.className = 'kv-label';
      tag.textContent = label;
      col.append(track, tag);
      kvHost.appendChild(col);
      return { fill, label: tag };
    });

    const promptHost = $('#s3PromptChips');
    const promptChips = TEXT.s3.io.promptTokens.map((token, index) => {
      const chip = document.createElement('span');
      chip.className = 'io-chip';
      const no = document.createElement('b');
      no.textContent = pad2(index + 1);
      const text = document.createElement('span');
      text.textContent = token;
      chip.append(no, text);
      promptHost.appendChild(chip);
      return chip;
    });

    const answerHost = $('#s3AnswerTokens');
    const answerTokens = TEXT.s3.io.answerTokens.map(token => {
      const el = document.createElement('span');
      el.className = 'io-token';
      el.textContent = token;
      answerHost.appendChild(el);
      return el;
    });

    return { cells, slots, flies, lanes, kvCols, promptChips, answerTokens };
  }

  function buildScene4() {
    const host = $('#s4Summary');
    const items = [];
    TEXT.s4.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'summary-item';
      const iconWrap = document.createElement('span');
      iconWrap.className = `summary-icon${item.tone ? ` ${item.tone}` : ''}`;
      iconWrap.setAttribute('aria-hidden', 'true');
      iconWrap.appendChild(mdIcon(item.icon));
      const textWrap = document.createElement('span');
      textWrap.className = 'summary-text-wrap';
      const no = document.createElement('span');
      no.className = 'summary-no';
      no.textContent = item.n;
      let body;
      if (item.formula) {
        // 公式也是原理的一部分：速度 ≈ 带宽 ÷ 模型大小。
        body = document.createElement('span');
        body.className = 'summary-formula';
        item.formula.forEach(part => {
          const piece = document.createElement('span');
          piece.textContent = part.text;
          if (part.op) piece.className = 'op';
          else if (part.tone) piece.className = `term ${part.tone}`;
          body.appendChild(piece);
        });
      } else {
        body = document.createElement('span');
        body.className = 'summary-text';
        body.textContent = item.text;
      }
      textWrap.append(no, body);
      row.append(iconWrap, textWrap);
      host.appendChild(row);
      items.push(row);
    });
    return items;
  }

  /* ============================================================
     3. 初始化数据与引用
     ============================================================ */
  hydrateText();
  const timelineData = buildTimeline();
  const segments = timelineData.segments;
  const totalSec = timelineData.totalSec;
  buildTimelineNotches(segments, totalSec);
  buildImplStrip();
  const s3Built = buildScene3();
  const s4Items = buildScene4();

  const ui = {
    timecode: $('#timecode'),
    sceneCounter: $('#sceneCounter'),
    timelineFill: $('#timelineFill'),
    scenes: $$('.scene')
  };

  const s1 = {
    model: $('#s1Model'),
    memory: $('#s1Memory'),
    modelFill: $('#s1ModelFill'),
    memoryFill: $('#s1MemoryFill'),
    routes: $$('.s1-routes .route-card'),
    strikes: [$('#s1Strike0'), $('#s1Strike1')],
    xs: [$('#s1X0'), $('#s1X1')],
    shortfall: $('.shortfall')
  };

  const s2 = {
    disk: $('#s2Disk'),
    arena: $('#s2Arena'),
    cpu: $('#s2Cpu'),
    dotA: $('#s2DotA'),
    dotB: $('#s2DotB'),
    cpuPulse: $('#s2CpuPulse'),
    stripItems: $$('#s2Strip .impl-item')
  };

  const s3 = {
    ...s3Built,
    pp: $('#s3Pp'),
    tg: $('#s3Tg'),
    phase: $('#s3Phase'),
    caret: $('#s3Caret'),
    memUsed: $('#s3MemUsed'),
    evict: $('#s3Evict'),
    memFill: $('#s3MemFill'),
    cpuArc: $('#s3CpuArc'),
    cpuCore: $('#s3CpuCore'),
    cpuRange: $('#s3CpuRange'),
    cpuStep: $('#s3CpuStep'),
    batch: $('#s3Batch'),
    flyLayer: $('#s3Fly')
  };

  // 64 层演示的时间轴（场景内毫秒）：prefill 一轮 + decode 两轮。
  const DEMO3 = {
    total: 11500,
    intro: 200,
    passes: [
      { kind: 'prefill', start: 600, dur: 3840, batch: 3, kv: [0, 1, 2] },
      { kind: 'decode', start: 4440, dur: 2880, batch: 1, kv: [3] },
      { kind: 'decode', start: 7320, dur: 2880, batch: 1, kv: [4] }
    ],
    tokenTimes: [4320, 7240, 10120],
    tail: { start: 10200, end: 10740, col: 5 },
    done: 10740
  };

  const S3WIN = {
    flyOffset: .04,
    flyStagger: .015,
    flyDur: .44,
    computeOffset: .54,
    computeDur: .26,
    kvOffset: .58,
    kvDur: .34,
    evict: .34
  };

  const s4 = {
    items: s4Items,
    close: $('#s4Close'),
    art: $('.final-art')
  };

  const memoryRatio = .24;
  let reduced = false;
  let forcedTime = null;
  let speed = 1;
  let shouldLoop = false;

  function readQuery() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('t')) {
      const value = parseFloat(params.get('t'));
      if (Number.isFinite(value)) forcedTime = clamp(value, 0, totalSec);
    }
    if (params.has('speed')) {
      const value = parseFloat(params.get('speed'));
      if (Number.isFinite(value) && value > 0) speed = clamp(value, .1, 8);
    }
    shouldLoop = params.get('loop') === '1';
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  /* ============================================================
     4. 每段动画
     ============================================================ */
  function renderScene1(u) {
    enter(s1.model, span(null, 0, .22, u), .92, 1.25);
    enter(s1.memory, span(null, .04, .26, u), .92, 1.25);
    enter(s1.routes[0], span(null, .12, .38, u), .93, 1.5);
    enter(s1.routes[1], span(null, .18, .44, u), .93, 1.5);

    const modelFill = easeOut(span(null, .04, .36, u));
    const memoryFill = easeOut(span(null, .20, .46, u)) * memoryRatio;
    s1.modelFill.style.transform = `scaleX(${modelFill})`;
    s1.memoryFill.style.transform = `scaleX(${memoryFill})`;

    const cross = easeOut(span(null, .40, .60, u));
    s1.strikes.forEach(strike => {
      strike.style.transform = `scaleX(${cross})`;
    });
    s1.xs.forEach(x => {
      x.style.opacity = String(.45 + cross * .45);
    });
    s1.shortfall.style.opacity = String(span(null, .26, .46, u));
  }

  function renderScene2(u) {
    enter(s2.disk, span(null, 0, .24, u), .92, 1.3);
    enter(s2.arena, span(null, .04, .28, u), .92, 1.3);
    enter(s2.cpu, span(null, .08, .32, u), .92, 1.3);

    const pA = span(null, .18, .35, u);
    const pB = span(null, .37, .54, u);
    const dotVisibility = p => {
      if (p <= 0 || p >= 1) return 0;
      return Math.min(1, p * 7, (1 - p) * 7);
    };
    s2.dotA.style.left = `${smooth(pA) * 100}%`;
    s2.dotA.style.opacity = String(dotVisibility(pA));
    s2.dotB.style.left = `${smooth(pB) * 100}%`;
    s2.dotB.style.opacity = String(dotVisibility(pB));

    const pulse = span(null, .53, .72, u);
    const pulseOpacity = pulse > 0 && pulse < 1 ? Math.sin(Math.PI * pulse) : 0;
    s2.cpuPulse.style.opacity = String(pulseOpacity * .9);
    s2.cpuPulse.style.transform = `translate(2.45cqw, -1.7cqw) scale(${.7 + pulse * 1.2})`;

    s2.stripItems.forEach((item, index) => {
      enter(item, span(null, 0, .20 + index * .055, u), .86, .5);
    });
  }

  function s3KvRows(col, t) {
    const [prefill, decode1, decode2] = DEMO3.passes;
    const fill = pass => {
      const stepDur = pass.dur / 8;
      const local = clamp(t - pass.start, 0, pass.dur);
      const step = Math.min(7, Math.floor(local / stepDur));
      const stepStart = pass.start + step * stepDur;
      const kvP = smooth(span(null,
        stepStart + S3WIN.kvOffset * stepDur,
        stepStart + (S3WIN.kvOffset + S3WIN.kvDur) * stepDur,
        t));
      return Math.min(64, (step + kvP) * 8);
    };
    if (col < 3) {
      if (t >= prefill.start + prefill.dur) return 64;
      if (t >= prefill.start) return fill(prefill);
      return 0;
    }
    if (col === 3) {
      if (t >= decode1.start + decode1.dur) return 64;
      if (t >= decode1.start) return fill(decode1);
      return 0;
    }
    if (col === 4) {
      if (t >= decode2.start + decode2.dur) return 64;
      if (t >= decode2.start) return fill(decode2);
      return 0;
    }
    if (t >= DEMO3.tail.end) return 64;
    if (t >= DEMO3.tail.start) {
      return smooth(span(null, DEMO3.tail.start, DEMO3.tail.end, t)) * 64;
    }
    return 0;
  }

  function renderScene3(u) {
    const t = clamp(u * DEMO3.total, 0, DEMO3.total);

    // 问题 token
    s3.promptChips.forEach((chip, index) => {
      const start = DEMO3.intro + index * 110;
      const p = smooth(span(null, start, start + 240, t));
      chip.style.opacity = String(p);
      chip.style.transform = `translate3d(0, ${((1 - p) * .4).toFixed(3)}cqw, 0)`;
    });

    // 回答 token
    let emitted = 0;
    s3.answerTokens.forEach((el, index) => {
      const at = DEMO3.tokenTimes[index];
      if (t >= at) emitted = index + 1;
      const p = smooth(span(null, at, at + 280, t));
      el.classList.toggle('is-on', t >= at);
      el.style.opacity = String(p);
      el.style.transform = `translate3d(0, ${((1 - p) * .35).toFixed(3)}cqw, 0)`;
    });
    s3.tg.textContent = String(emitted);

    // pp 3
    const ppP = smooth(span(null, DEMO3.passes[0].start + 250, DEMO3.passes[0].start + 900, t));
    s3.pp.textContent = String(Math.round(3 * ppP));

    const done = t >= DEMO3.done;
    const blink = .5 + .5 * Math.sin(t / 170);
    s3.caret.style.opacity = String(done ? .45 : emitted > 0 ? .6 + blink * .4 : .25 + blink * .35);

    // 当前那一遍 / 那一组 8 层
    let pass = null;
    let passIndex = -1;
    for (let i = 0; i < DEMO3.passes.length; i += 1) {
      const item = DEMO3.passes[i];
      if (t >= item.start && t < item.start + item.dur) {
        pass = item;
        passIndex = i;
        break;
      }
    }

    let base = -1;
    let step = 0;
    let stepDur = 0;
    let stepStart = 0;
    if (pass) {
      stepDur = pass.dur / 8;
      const local = t - pass.start;
      step = Math.min(7, Math.floor(local / stepDur));
      stepStart = pass.start + step * stepDur;
      base = step * 8;
    }

    // 磁盘 64 格：读头一格一格前移，搬完的层变暗
    const cqw = stageEl.clientWidth / 100;
    let flyWindows = [];
    if (pass) {
      flyWindows = Array.from({ length: 8 }, (_, i) => {
        const start = stepStart + (S3WIN.flyOffset + i * S3WIN.flyStagger) * stepDur;
        return { start, end: start + S3WIN.flyDur * stepDur };
      });
    }
    s3.cells.forEach((cell, index) => {
      const row = Math.floor(index / 8);
      const col = index % 8;
      let read = !!pass && index < base;
      let current = false;
      if (pass && row === step) {
        const win = flyWindows[col];
        current = t >= win.start && t < win.end;
        read = read || t >= win.end;
      }
      cell.classList.toggle('is-read', read);
      cell.classList.toggle('is-current', current);
    });

    // 内存 8 槽 + 飞行块
    s3.flies.forEach(fly => { fly.style.opacity = '0'; });
    if (pass) {
      const leadFly = flyWindows[0];
      s3.evict.style.opacity = String(t >= leadFly.start && t < leadFly.end ? 1 : 0);
      s3.memUsed.textContent = fmt(TEXT.s3.mem.used, { n: 8 });
      s3.memFill.style.transform = 'scaleX(1)';
      const flyRect = s3.flyLayer.getBoundingClientRect();

      s3.slots.forEach((slot, index) => {
        const win = flyWindows[index];
        const flyStart = win.start;
        const flyEnd = win.end;
        const arriveP = smooth(span(null, flyEnd, flyEnd + .09 * stepDur, t));
        const prevBase = step > 0 ? base - 8 : passIndex > 0 ? 56 : -1;
        const evictP = smooth(span(null, flyEnd - .18 * stepDur, flyEnd, t));
        const evicting = prevBase >= 0 && t < flyEnd && evictP > .02;
        const opacity = t >= flyEnd ? arriveP : prevBase >= 0 ? 1 - evictP : 0;
        slot.block.classList.toggle('is-evict', evicting);
        slot.block.style.opacity = String(opacity.toFixed(3));

        if (evicting) {
          slot.block.style.transform = `translate3d(${(-.5 * evictP).toFixed(3)}cqw, 0, 0) scale(${(1 - .04 * evictP).toFixed(3)})`;
        } else if (t >= flyEnd) {
          slot.block.style.transform = `translate3d(0, ${((1 - arriveP) * .6).toFixed(3)}cqw, 0) scale(${(.96 + .04 * arriveP).toFixed(3)})`;
        } else {
          slot.block.style.transform = 'translate3d(0, 0, 0) scale(1)';
        }

        slot.name.textContent = t < flyEnd && prevBase >= 0
          ? `L${pad2(prevBase + index)}`
          : `L${pad2(base + index)}`;

        if (t >= flyStart && t < flyEnd) {
          const from = s3.cells[base + index].getBoundingClientRect();
          const to = slot.slot.getBoundingClientRect();
          if (!from.width || !to.width) return;
          const size = Math.min(from.width, from.height) * .92;
          const raw = clamp01((t - flyStart) / (flyEnd - flyStart));
          const eased = emphasized(raw);
          const sx = from.left - flyRect.left + (from.width - size) / 2;
          const sy = from.top - flyRect.top + (from.height - size) / 2;
          const tx = to.left - flyRect.left + (to.width - size) / 2;
          const ty = to.top - flyRect.top + (to.height - size) / 2;
          const dx = tx - sx;
          const dy = ty - sy;
          const len = Math.hypot(dx, dy) || 1;
          const nx = dy / len;
          const ny = -dx / len;
          const curve = Math.sin(Math.PI * raw) * Math.min(cqw * 2, len * .2);
          const x = lerp(sx, tx, eased) + nx * curve;
          const y = lerp(sy, ty, eased) + ny * curve;
          const scale = .9 + .1 * eased + .05 * Math.sin(Math.PI * raw);
          const fly = s3.flies[index];
          fly.textContent = `L${pad2(base + index)}`;
          fly.style.width = `${size.toFixed(1)}px`;
          fly.style.height = `${size.toFixed(1)}px`;
          fly.style.opacity = String(Math.max(0, Math.min(1, raw / .1, (1 - raw) / .12)));
          fly.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) scale(${scale.toFixed(3)})`;
        }
      });
    } else {
      const showLast = t >= DEMO3.passes[0].start;
      s3.evict.style.opacity = '0';
      s3.memUsed.textContent = fmt(TEXT.s3.mem.used, { n: showLast ? 8 : 0 });
      s3.memFill.style.transform = `scaleX(${showLast ? 1 : 0})`;
      s3.slots.forEach((slot, index) => {
        slot.block.style.opacity = showLast ? '1' : '0';
        slot.name.textContent = showLast ? `L${pad2(56 + index)}` : '';
      });
    }

    // CPU 计算条
    if (pass) {
      const computeStart = stepStart + S3WIN.computeOffset * stepDur;
      const computeEnd = computeStart + S3WIN.computeDur * stepDur;
      s3.cpuRange.textContent = fmt(TEXT.s3.cpu.range, { from: pad2(base), to: pad2(base + 7) });
      s3.cpuStep.textContent = fmt(TEXT.s3.cpu.group, { n: step + 1 });
      s3.batch.textContent = fmt(TEXT.s3.cpu.batch, { n: pass.batch });
      const coreP = clamp01((t - computeStart) / (computeEnd - computeStart));
      s3.lanes.forEach((lane, index) => {
        const p = clamp01((t - (computeStart + index * .012 * stepDur)) / (.26 * stepDur));
        lane.style.height = `${(smooth(p) * 100).toFixed(1)}%`;
      });
      s3.cpuCore.style.transform = `scale(${(1 + Math.sin(Math.PI * clamp01(coreP)) * .04).toFixed(4)})`;
      s3.cpuArc.style.strokeDashoffset = String(289.03 * (1 - clamp01((t - pass.start) / pass.dur)));
    } else {
      const started = t >= DEMO3.passes[0].start;
      s3.cpuRange.textContent = fmt(TEXT.s3.cpu.range, {
        from: started ? '56' : '00',
        to: started ? '63' : '07'
      });
      s3.cpuStep.textContent = started ? fmt(TEXT.s3.cpu.group, { n: 8 }) : '';
      s3.batch.textContent = fmt(TEXT.s3.cpu.batch, { n: started ? 1 : 3 });
      s3.lanes.forEach(lane => { lane.style.height = started ? '100%' : '0%'; });
      s3.cpuCore.style.transform = 'scale(1)';
      s3.cpuArc.style.strokeDashoffset = String(289.03 * (1 - (started ? 1 : 0)));
    }

    // KV 6 列
    s3.kvCols.forEach((col, index) => {
      const rows = s3KvRows(index, t);
      col.fill.style.height = `${((rows / 64) * 100).toFixed(2)}%`;
      col.label.style.opacity = rows > 0 ? '1' : '.55';
    });

    // 阶段
    let phaseText = TEXT.s3.io.phaseIdle;
    let phaseClass = '';
    if (pass) {
      if (pass.kind === 'prefill') {
        phaseText = TEXT.s3.io.phasePrefill;
        phaseClass = 'is-prefill';
      } else {
        phaseText = fmt(TEXT.s3.io.phaseDecode, { n: passIndex + 1 });
        phaseClass = 'is-decode';
      }
    } else if (t >= DEMO3.done) {
      phaseText = TEXT.s3.io.phaseDone;
    } else if (t >= DEMO3.tail.start) {
      phaseText = fmt(TEXT.s3.io.phaseDecode, { n: 3 });
      phaseClass = 'is-decode';
    }
    s3.phase.textContent = phaseText;
    s3.phase.className = `io-phase${phaseClass ? ` ${phaseClass}` : ''}`;
  }

  function renderScene4(u) {
    s4.items.forEach((item, index) => {
      const p = smooth(span(null, index * .05, .16 + index * .05, u));
      item.style.opacity = String(.75 + p * .25);
      item.style.transform = `translate3d(0, ${((1 - p) * 1.1).toFixed(3)}cqw, 0)`;
    });

    // 最后一句：内存不再限制模型大小。
    const closeP = smooth(span(null, .22, .40, u));
    s4.close.style.opacity = String(.7 + closeP * .3);
    s4.close.style.transform = `translate3d(0, ${((1 - closeP) * .7).toFixed(3)}cqw, 0)`;

    const artP = smooth(span(null, .04, .34, u));
    s4.art.style.opacity = String(.55 + artP * .45);
  }

  /* ============================================================
     5. 场景切换、时钟、启动
     ============================================================ */
  function sceneIndexAt(time) {
    for (let index = 0; index < segments.length; index += 1) {
      if (time < segments[index].end - 1e-7) return index;
    }
    return Math.max(0, segments.length - 1);
  }

  function formatTime(seconds) {
    const value = Math.max(0, Math.floor(seconds + 1e-7));
    const minutes = Math.floor(value / 60);
    const rest = value % 60;
    return `${pad2(minutes)}:${pad2(rest)}`;
  }

  function updateChrome(time, index) {
    const clampedTime = clamp(time, 0, totalSec);
    if (ui.timecode) {
      ui.timecode.textContent = fmt(TEXT.chrome.timePattern, {
        now: formatTime(clampedTime),
        total: formatTime(totalSec)
      });
    }
    if (ui.sceneCounter) {
      ui.sceneCounter.textContent = fmt(TEXT.chrome.scenePattern, {
        n: pad2(index + 1),
        total: pad2(segments.length)
      });
    }
    if (ui.timelineFill && totalSec > 0) {
      ui.timelineFill.style.width = `${(clampedTime / totalSec) * 100}%`;
    }
  }

  const state = {
    time: 0,
    currentScene: -1,
    playing: false,
    lastStamp: null
  };

  function render(time) {
    if (!segments.length) return;
    const safeTime = clamp(time, 0, totalSec);
    const index = sceneIndexAt(safeTime);
    const segment = segments[index];
    const local = safeTime >= totalSec
      ? segment.durSec
      : clamp(safeTime - segment.start, 0, segment.durSec);
    const u = segment.durSec > 0 ? clamp01(local / segment.durSec) : 1;

    if (index !== state.currentScene) {
      ui.scenes.forEach((scene, sceneIndex) => {
        const active = sceneIndex === index;
        scene.classList.toggle('is-active', active);
        scene.setAttribute('aria-hidden', active ? 'false' : 'true');
      });
      state.currentScene = index;
    }

    updateChrome(safeTime, index);
    if (index === 0) renderScene1(u);
    else if (index === 1) renderScene2(u);
    else if (index === 2) renderScene3(u);
    else if (index === 3) renderScene4(u);

    state.time = safeTime;
  }

  function tick(stamp) {
    if (!state.playing) return;
    if (state.lastStamp === null) state.lastStamp = stamp;
    let dt = (stamp - state.lastStamp) / 1000;
    state.lastStamp = stamp;
    if (!Number.isFinite(dt) || dt < 0) dt = 0;
    if (dt > .25) dt = .1;

    state.time += dt * speed;

    if (state.time >= totalSec) {
      if (shouldLoop) {
        state.time = totalSec > 0 ? state.time % totalSec : 0;
        render(state.time);
        requestAnimationFrame(tick);
        return;
      }
      state.time = totalSec;
      state.playing = false;
      state.lastStamp = null;
      render(totalSec);
      return;
    }

    render(state.time);
    requestAnimationFrame(tick);
  }

  function start() {
    readQuery();

    // ?t=... 优先：静态停在该时刻。reduced-motion 若没有显式 t，则直接到最终帧。
    if (forcedTime !== null) {
      state.playing = false;
      state.time = forcedTime;
      render(forcedTime);
      return;
    }
    if (reduced) {
      state.playing = false;
      render(totalSec);
      return;
    }

    state.playing = true;
    state.time = 0;
    render(0);
    state.lastStamp = null;
    requestAnimationFrame(tick);
  }

  // 字体、尺寸稳定后再补一帧，保证 ?t= 截图定位准确。
  const rerenderStatic = () => {
    if (!state.playing) render(state.time);
  };
  window.addEventListener('load', rerenderStatic);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(rerenderStatic);
  }
  window.addEventListener('resize', () => {
    requestAnimationFrame(rerenderStatic);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) state.lastStamp = null;
  });

  start();
})();

</script>
</body>
</html>
