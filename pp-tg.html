  font-weight: 500;
  line-height: 1.2;
  white-space: nowrap;
}

.phase-chip.is-fly {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
  border-color: transparent;
}

.phase-chip.is-compute {
  background: var(--md-primary-container);
  color: var(--md-on-primary-container);
  border-color: transparent;
}

.phase-chip.is-unpin {
  background: var(--md-surface-container-high);
  color: var(--md-on-surface-variant);
  border-color: transparent;
}

.phase-chip.is-done {
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
  border-color: transparent;
}

.phase-detail {
  min-width: 0;
  overflow: hidden;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.usage { margin-top: .5cqw; }

.usage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
}

.usage-head span:last-child { font-variant-numeric: tabular-nums; }

.usage-track {
  position: relative;
  height: 4px;
  min-height: 4px;
  margin-top: .28cqw;
  overflow: hidden;
  border-radius: 2px;
  background: var(--md-surface-container-highest);
}

.usage-fill {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--md-primary);
  will-change: width;
}

.arena-note {
  margin: .4cqw 0 0;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  line-height: 1.35;
}

/* CPU 节点 */
.node-list {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.cpu-row {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 1.5cqw minmax(0, 1fr) auto;
  align-items: center;
  gap: .5cqw;
  padding: .25cqw .5cqw;
  border-bottom: 1px solid var(--md-outline-variant);
  border-radius: 0;
  background: transparent;
  will-change: background-color;
}

.cpu-row:last-child { border-bottom-color: transparent; }

.cpu-row.is-computing {
  background: var(--md-secondary-container);
  border-bottom-color: transparent;
  border-radius: var(--shape-xs);
}

.cpu-row.is-computing .cpu-name,
.cpu-row.is-computing .cpu-state { color: var(--md-on-secondary-container); }

.cpu-dot {
  width: 1.2cqw;
  height: 1.2cqw;
  min-width: 11px;
  min-height: 11px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--md-surface-container-high);
  color: var(--md-on-primary-container);
}

.cpu-dot .md-icon { --icon-size: 70%; min-width: 0; min-height: 0; opacity: 0; }

.cpu-row.is-computing .cpu-dot { background: var(--md-primary); color: var(--md-on-primary); }
.cpu-row.is-done .cpu-dot { background: var(--md-primary-container); color: var(--md-on-primary-container); }
.cpu-row.is-done .cpu-dot .md-icon { opacity: 1; }

.cpu-name {
  overflow: hidden;
  color: var(--md-on-surface);
  font-size: var(--type-body-medium);
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.cpu-state {
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  white-space: nowrap;
}

.cpu-row.is-computing .cpu-state { color: var(--md-on-primary-container); }

.cpu-bar {
  position: absolute;
  left: .5cqw;
  right: .5cqw;
  bottom: 1px;
  height: 2px;
  border-radius: 1px;
  overflow: hidden;
  background: transparent;
}

.cpu-bar i {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: var(--md-primary);
  transform: scaleX(0);
  transform-origin: left center;
  will-change: transform;
}

.node-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .6cqw;
  margin-top: .55cqw;
  padding-top: .5cqw;
  border-top: 1px solid var(--md-outline-variant);
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
}

.node-foot b { color: var(--md-on-surface); font-weight: 500; }

/* 飞行块 */
.fly-layer {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
  overflow: visible;
}

.fly-tile {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  gap: .4cqw;
  padding: 0 .6cqw;
  border-radius: var(--shape-xs);
  background: var(--md-surface-container-highest);
  box-shadow: var(--elevation-2);
  opacity: 0;
  will-change: transform, opacity;
}

.fly-tile .fly-dot {
  width: .55cqw;
  height: .55cqw;
  min-width: 6px;
  min-height: 6px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--md-primary);
}

.fly-tile .fly-name {
  overflow: hidden;
  color: var(--md-on-surface);
  font-size: var(--type-label-medium);
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.fly-tile .fly-tech {
  margin-left: auto;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-small);
  font-weight: 500;
  white-space: nowrap;
}

/* ============ 底部 ============ */
.footer {
  position: absolute;
  z-index: 20;
  left: 4.75cqw;
  right: 4.75cqw;
  bottom: 2.65cqw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5cqw;
  color: var(--md-on-surface-variant);
  font-size: var(--type-label-medium);
}

.footer-hint {
  display: flex;
  align-items: center;
  gap: .45cqw;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.live-dot {
  width: .38cqw;
  height: .38cqw;
  min-width: 5px;
  min-height: 5px;
  border-radius: 50%;
  background: var(--md-primary);
  flex: 0 0 auto;
}

.footer-meta {
  display: flex;
  align-items: center;
  gap: .5cqw;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}

.timeline-track {
  position: absolute;
  z-index: 20;
  left: 4.75cqw;
  right: 4.75cqw;
  bottom: 1.55cqw;
  height: 2px;
  border-radius: 1px;
  background: var(--md-surface-container-high);
  overflow: hidden;
}

.timeline-fill {
  display: block;
  width: 0;
  height: 100%;
  background: var(--md-primary);
  will-change: width;
}

@media (prefers-reduced-motion: reduce) {
  .timeline-fill,
  .usage-fill,
  .cpu-bar i,
  .fly-tile,
  .answer-caret { will-change: auto; }
}

<main id="stage" aria-label="">
  <header class="topbar">
    <div class="brand-lockup">

  </header>

  <section class="scene">
    <header class="scene-head">
      <div class="scene-heading">
        <div class="kicker">
          <span class="kicker-icon" aria-hidden="true"><svg class="md-icon"><use href="#i-cpu"></use></svg></span>

                <div class="panel-label" data-t="arena.label"></div>

<script>

(() => {
  'use strict';

  /* ============================================================
     1. 基础工具
     ============================================================ */
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const clamp01 = value => clamp(value, 0, 1);
  const lerp = (a, b, p) => a + (b - a) * p;
  const pad2 = value => String(value).padStart(2, '0');
  const smooth = value => {
    const v = clamp01(value);
    return v * v * (3 - 2 * v);
  };
  const span = (start, end, time) => clamp01((time - start) / (end - start));
  const fmt = (template, values) => template.replace(/\{(\w+)\}/g, (_, key) => (
    Object.prototype.hasOwnProperty.call(values, key) ? values[key] : ''
  ));
  const readPath = path => path.split('.').reduce((node, key) => (
    node == null ? undefined : node[key]
  ), TEXT);
  const stageEl = $('#stage');
  const setTransform = (el, value) => { el.style.transform = value; };

  const mdIcon = (id, className = 'md-icon') => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', className);
    svg.setAttribute('aria-hidden', 'true');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', `#${id}`);
    svg.appendChild(use);
    return svg;
  };

  /* ============================================================
     2. 文案 + 动态节点
     ============================================================ */
  function hydrateText() {
    document.title = TEXT.docTitle;
    stageEl.setAttribute('aria-label', TEXT.stageLabel);
    $$('[data-t]').forEach(el => {
      const value = readPath(el.dataset.t);
      if (value !== undefined && value !== null) el.textContent = value;
    });
  }

  function buildPromptChips() {
    const host = $('#promptChips');
    return TEXT.req.chips.map((token, index) => {
      const chip = document.createElement('span');
      chip.className = 'req-chip';
      const no = document.createElement('b');
      no.textContent = pad2(index + 1);
      const text = document.createElement('span');
      text.textContent = token;
      chip.append(no, text);
      host.appendChild(chip);
      return chip;
    });
  }

  function buildAnswerTokens() {
    const host = $('#answerTokens');
    return TEXT.answer.tokens.map(token => {
      const el = document.createElement('span');
      el.className = 'ans-token';
      el.textContent = token;
      host.appendChild(el);
      return el;
    });
  }

  function buildWorkbench() {
    const layerHost = $('#layerList');
    const arenaHost = $('#arenaStage');
    const nodeHost = $('#nodeList');
    const flyHost = $('#flyLayer');

    const layerRows = [];
    const slots = [];
    const tiles = [];
    const nodeRows = [];

    TEXT.layers.forEach((layer, index) => {
      // 硬盘层
      const row = document.createElement('div');
      row.className = 'layer-row';
      const name = document.createElement('span');
      name.className = 'layer-name';
      name.textContent = layer.name;
      const share = document.createElement('span');
      share.className = 'layer-share';
      share.textContent = `${layer.share}%`;
      row.append(name, share);
      layerHost.appendChild(row);
      layerRows.push({ row });

      // arena 槽位
      const slot = document.createElement('div');
      slot.className = 'arena-slot';
      const block = document.createElement('div');
      block.className = 'arena-block';
      const blockName = document.createElement('span');
      blockName.className = 'block-name';
      blockName.textContent = layer.name;
      const pin = document.createElement('span');
      pin.className = 'block-pin';
      pin.textContent = TEXT.arena.pin;
      block.append(blockName, pin);
      slot.appendChild(block);
      arenaHost.appendChild(slot);
      slots.push({ slot, block });

      // 飞行小卡
      const tile = document.createElement('div');
      tile.className = 'fly-tile';
      const dot = document.createElement('span');
      dot.className = 'fly-dot';
      const flyName = document.createElement('span');
      flyName.className = 'fly-name';
      flyName.textContent = layer.name;
      const tech = document.createElement('span');
      tech.className = 'fly-tech';
      tech.textContent = 'pread';
      tile.append(dot, flyName, tech);
      flyHost.appendChild(tile);
      tiles.push(tile);

      // CPU 节点
      const node = document.createElement('div');
      node.className = 'cpu-row';
      const nodeDot = document.createElement('span');
      nodeDot.className = 'cpu-dot';
      nodeDot.appendChild(mdIcon('i-check'));
      const nodeName = document.createElement('span');
      nodeName.className = 'cpu-name';
      nodeName.textContent = `层 ${pad2(index)}`;
      const state = document.createElement('span');
      state.className = 'cpu-state';
      state.textContent = TEXT.phase.idle;
      const nodeBar = document.createElement('span');
      nodeBar.className = 'cpu-bar';
      const nodeFill = document.createElement('i');
      nodeBar.appendChild(nodeFill);
      node.append(nodeDot, nodeName, state, nodeBar);
      nodeHost.appendChild(node);
      nodeRows.push({ row: node, state, fill: nodeFill });
    });

    return { layerRows, slots, tiles, nodeRows };
  }

  hydrateText();
  const promptChips = buildPromptChips();
  const answerTokens = buildAnswerTokens();
  const wb = buildWorkbench();

  const ui = {
    pp: $('#ppCount'),
    tg: $('#tgCount'),
    caret: $('#answerCaret'),
    phase: $('#phaseChip'),
    detail: $('#phaseDetail'),
    used: $('#arenaUsed'),
    fill: $('#arenaFill'),
    batch: $('#batchLabel'),
    timecode: $('#timecode'),
    timelineFill: $('#timelineFill'),
    flyLayer: $('#flyLayer'),
    workbench: $('#workbench')
  };

  /* ============================================================
     3. 时间轴
     ============================================================ */
  const TOTAL = TIMING.total;
  const PREFILL = {
    kind: 'prefill',
    start: TIMING.prefillStart,
    dur: TIMING.prefillDur,
    batch: 3
  };
  const CYCLES = [PREFILL];
  for (let i = 0; i < TIMING.decodeCount; i += 1) {
    CYCLES.push({
      kind: 'decode',
      start: TIMING.decodeStart + i * TIMING.decodeDur,
      dur: TIMING.decodeDur,
      batch: 1
    });
  }

  // 第一个 token 来自 prefill 的 logits，之后每个 decode 圈吐一个。
  const tokenTimes = [PREFILL.start + PREFILL.dur * WIN.emit];
  CYCLES.slice(1).forEach(cycle => {
    tokenTimes.push(cycle.start + cycle.dur * WIN.emit);
  });
  const doneTime = CYCLES[CYCLES.length - 1].start + CYCLES[CYCLES.length - 1].dur;

  const layerWindows = cycle => TEXT.layers.map((layer, index) => {
    const flyStart = cycle.start + cycle.dur * (WIN.flyOffset + index * WIN.flyStagger);
    const flyEnd = flyStart + cycle.dur * WIN.flyDur;
    const computeStart = cycle.start + cycle.dur * (WIN.computeOffset + index * WIN.computeStagger);
    const computeEnd = computeStart + cycle.dur * WIN.computeDur;
    return { layer, index, flyStart, flyEnd, computeStart, computeEnd };
  });

  function cycleAt(time) {
    for (let i = 0; i < CYCLES.length; i += 1) {
      const cycle = CYCLES[i];
      if (time >= cycle.start && time < cycle.start + cycle.dur) {
        return { cycle, index: i, local: (time - cycle.start) / cycle.dur };
      }
    }
    return null;
  }

  /* ============================================================
     4. 参数
     ============================================================ */
  let forcedTime = null;
  let speed = 1;
  let shouldLoop = false;
  let reduced = false;

  function readQuery() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('t')) {
      const value = parseFloat(params.get('t'));
      if (Number.isFinite(value)) forcedTime = clamp(value, 0, TOTAL / 1000);
    }
    if (params.has('speed')) {
      const value = parseFloat(params.get('speed'));
      if (Number.isFinite(value) && value > 0) speed = clamp(value, .1, 8);
    }
    shouldLoop = params.get('loop') === '1';
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  /* ============================================================
     5. 渲染
     ============================================================ */
  function resetWorkbench() {
    wb.layerRows.forEach(item => {
      item.row.classList.remove('is-reading', 'is-loaded');
    });
    wb.nodeRows.forEach(item => {
      item.row.classList.remove('is-computing', 'is-done');
      item.state.textContent = TEXT.phase.idle;
      setTransform(item.fill, 'scaleX(0)');
    });
    wb.slots.forEach(item => {
      item.block.style.opacity = '0';
    });
    wb.tiles.forEach(tile => { tile.style.opacity = '0'; });
    ui.used.textContent = '0%';
    ui.fill.style.width = '0%';
    ui.batch.textContent = '';
  }

  function render(time) {
    const t = clamp(time, 0, TOTAL);

    // 问题 token 依次点亮
    promptChips.forEach((chip, index) => {
      const start = TIMING.promptTokens + index * 115;
      const p = smooth(span(start, start + 240, t));
      chip.style.opacity = String(p);
      chip.style.transform = `translate3d(0, ${((1 - p) * .45).toFixed(3)}cqw, 0)`;
    });

    // 回答 token
    let emitted = 0;
    answerTokens.forEach((el, index) => {
      const at = tokenTimes[index];
      if (t >= at) emitted = index + 1;
      const p = smooth(span(at, at + 300, t));
      const on = t >= at;
      el.classList.toggle('is-on', on);
      el.style.opacity = String(p);
      el.style.transform = `translate3d(0, ${((1 - p) * .4).toFixed(3)}cqw, 0)`;
    });
    ui.tg.textContent = String(emitted);

    // pp 计数：prefill 阶段 0 → 3
    const ppP = smooth(span(PREFILL.start + 300, PREFILL.start + 900, t));
    ui.pp.textContent = String(Math.round(3 * ppP));

    // 光标
    const done = t >= doneTime;
    const blink = .5 + .5 * Math.sin(t / 170);
    ui.caret.style.opacity = String(done ? .45 : emitted > 0 ? .6 + blink * .4 : .25 + blink * .35);

    // 工作台
    const current = cycleAt(t);
    resetWorkbench();

    if (!current) {
      if (done) {
        // 收尾：保留最后一圈的样子，避免最后 1 秒画面空掉。
        wb.layerRows.forEach(item => item.row.classList.add('is-loaded'));
        wb.nodeRows.forEach(item => {
          item.row.classList.add('is-done');
          item.state.textContent = '完成';
        });
        wb.slots.forEach(item => { item.block.style.opacity = '1'; });
        ui.used.textContent = '100%';
        ui.fill.style.width = '100%';
        ui.batch.textContent = fmt(TEXT.cpu.batch, { n: 1 });
        ui.phase.textContent = TEXT.phase.done;
        ui.phase.className = 'phase-chip is-done';
        ui.detail.textContent = TEXT.detail.done;
      } else {
        ui.phase.textContent = TEXT.phase.idle;
        ui.phase.className = 'phase-chip';
        ui.detail.textContent = TEXT.detail.idle;
        ui.batch.textContent = '';
      }
      updateChrome(t);
      return;
    }

    const { cycle, local } = current;
    const windows = layerWindows(cycle);
    const flyPhase = local < WIN.computeOffset;
    const computePhase = local >= WIN.computeOffset && local < WIN.emit;
    const unpinPhase = local >= WIN.emit;
    const unpinP = smooth(span(cycle.start + cycle.dur * WIN.unpin, cycle.start + cycle.dur, t));

    let filled = 0;
    let readingName = '';

    windows.forEach((win, index) => {
      const row = wb.layerRows[index];
      const slot = wb.slots[index];
      const node = wb.nodeRows[index];
      const tile = wb.tiles[index];

      const flyP = clamp01((t - win.flyStart) / (win.flyEnd - win.flyStart));
      const flyOn = t >= win.flyStart && t < win.flyEnd;
      const arrived = t >= win.flyEnd;
      const computeP = clamp01((t - win.computeStart) / (win.computeEnd - win.computeStart));
      const computing = t >= win.computeStart && t < win.computeEnd;
      const computed = t >= win.computeEnd;

      // 硬盘行：搬运时高亮，读完后变暗
      const reading = t >= win.flyStart && t < win.flyEnd + 60;
      const loaded = t >= win.flyEnd + 60;
      row.row.classList.toggle('is-reading', reading);
      row.row.classList.toggle('is-loaded', loaded);
      if (reading) readingName = win.layer.name;

      // arena 槽位
      const blockOpacity = arrived ? Math.min(1, (t - win.flyEnd) / 110) * (1 - unpinP) : 0;
      slot.block.style.opacity = String(blockOpacity.toFixed(3));
      if (arrived && unpinP < .5) filled += 1;

      // CPU 节点
      node.row.classList.toggle('is-computing', computing);
      node.row.classList.toggle('is-done', computed);
      node.state.textContent = computing ? '计算中' : computed ? '完成' : '待机';
      setTransform(node.fill, `scaleX(${computing ? computeP : 0})`);

      // 飞行卡
      if (flyOn) {
        const layerRect = row.row.getBoundingClientRect();
        const slotRect = slot.slot.getBoundingClientRect();
        const layerRectFly = ui.flyLayer.getBoundingClientRect();
        if (!layerRect.width || !slotRect.width) {
          tile.style.opacity = '0';
          return;
        }
        const eased = smooth(flyP);
        const startX = layerRect.left - layerRectFly.left + .55 * (layerRect.width * .18);
        const startY = layerRect.top - layerRectFly.top + layerRect.height / 2 - Math.min(layerRect.height * .3, 1.1 * (stageEl.clientWidth / 100));
        const endX = slotRect.left - layerRectFly.left;
        const endY = slotRect.top - layerRectFly.top;
        const width = Math.min(layerRect.width * .62, slotRect.width * .92);
        const height = Math.min(layerRect.height * .62, slotRect.height * .9);
        const x = lerp(startX, endX + (slotRect.width - width) / 2, eased);
        const y = lerp(startY, endY + (slotRect.height - height) / 2, eased);
        const fade = Math.min(1, flyP / .12, (1 - flyP) / .1);
        tile.style.width = `${width}px`;
        tile.style.height = `${height}px`;
        tile.style.opacity = String(Math.max(0, fade) * .98);
        tile.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0)`;
      }
    });

    const usedPct = Math.round((filled / TEXT.layers.length) * 100);
    ui.used.textContent = `${usedPct}%`;
    ui.fill.style.width = `${usedPct}%`;

    // 阶段
    let phase = 'fly';
    if (computePhase) phase = 'compute';
    if (unpinP > .05 || local >= WIN.unpin) phase = 'unpin';
    ui.phase.textContent = TEXT.phase[phase];
    ui.phase.className = `phase-chip is-${phase}`;
    if (flyPhase) {
      ui.detail.textContent = fmt(TEXT.detail.fly, { name: readingName || TEXT.layers[0].name });
    } else if (computePhase) {
      ui.detail.textContent = TEXT.detail.compute;
    } else {
      ui.detail.textContent = TEXT.detail.unpin;
    }

    // batch 标
    ui.batch.textContent = fmt(TEXT.cpu.batch, { n: cycle.batch });

    updateChrome(t);
  }

  function updateChrome(t) {
    const seconds = Math.floor(t / 1000 + 1e-7);
    ui.timecode.textContent = fmt(TEXT.chrome.timePattern, {
      now: `00:${pad2(seconds)}`,
      total: `00:${pad2(Math.round(TOTAL / 1000))}`
    });
    ui.timelineFill.style.width = `${(t / TOTAL) * 100}%`;
  }

  /* ============================================================
     6. 播放
     ============================================================ */
  const state = {
    time: 0,
    playing: false,
    lastStamp: null
  };

  function tick(stamp) {
    if (!state.playing) return;
    if (state.lastStamp === null) state.lastStamp = stamp;
    let dt = (stamp - state.lastStamp) / 1000;
    state.lastStamp = stamp;
    if (!Number.isFinite(dt) || dt < 0) dt = 0;
    if (dt > .25) dt = .1;

    state.time += dt * speed;

    if (state.time >= TOTAL / 1000) {
      if (shouldLoop) {
        state.time = state.time % (TOTAL / 1000);
        render(state.time * 1000);
        requestAnimationFrame(tick);
        return;
      }
      state.time = TOTAL / 1000;
      state.playing = false;
      state.lastStamp = null;
      render(TOTAL);
      return;
    }

    render(state.time * 1000);
    requestAnimationFrame(tick);
  }

  function start() {
    readQuery();

    if (forcedTime !== null) {
      state.playing = false;
      state.time = forcedTime;
      render(forcedTime * 1000);
      return;
    }
    if (reduced) {
      state.playing = false;
      state.time = TOTAL / 1000;
      render(TOTAL);
      return;
    }

    state.playing = true;
    state.time = 0;
    render(0);
    state.lastStamp = null;
    requestAnimationFrame(tick);
  }

  const rerenderStatic = () => {
    if (!state.playing) render(state.time * 1000);
  };
  window.addEventListener('load', rerenderStatic);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(rerenderStatic);
  }
  window.addEventListener('resize', () => {
    requestAnimationFrame(rerenderStatic);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) state.lastStamp = null;
  });

  start();
})();

</script>
</body>
